name: web_server
description: >-
  A webes versenyarchívum szervere (ADR 0047, ADR 0048): import, archívum
  és webes DB, REST API. Pure Dart, AOT-binárisként fut a VPS-en.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  args: ^2.6.0
  data:
    path: ../../packages/data
  domain:
    path: ../../packages/domain
  drift: ^2.33.0
  equatable: ^2.0.5
  http_parser: ^4.1.2
  meta: ^1.16.0
  mime: ^2.0.0
  race_archive_api:
    path: ../../packages/race_archive_api
  shared:
    path: ../../packages/shared
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqlite3: ^3.1.5
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  test: ^1.25.0
