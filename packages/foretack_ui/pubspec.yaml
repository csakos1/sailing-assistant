name: foretack_ui
description: >-
  A Foretack közös design-rendszere (ADR 0041, ADR 0047 D2–D3): téma,
  színtokenek, tipográfia, bundle-ölt fontok és licencek. A phone és a web
  közösen használja.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  domain:
    path: ../domain
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# A fontok és a licenc-szövegek itt élnek (ADR 0047 Addendum 4 E10). A
# fogyasztó appban a családnév `packages/foretack_ui/<család>`, az asset
# pedig `packages/foretack_ui/assets/...` alakban érhető el.
flutter:
  assets:
    - assets/fonts/OFL-IBMPlex.txt
    - assets/fonts/OFL-MartianMono.txt
  fonts:
    - family: Martian Mono
      fonts:
        - asset: assets/fonts/MartianMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/MartianMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MartianMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/MartianMono-ExtraBold.ttf
          weight: 800
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
